<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f4e9d2"/>
      <stop offset="0.52" stop-color="#e6d5b5"/>
      <stop offset="1" stop-color="#ceb994"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#283452"/>
      <stop offset="0.6" stop-color="#1b243c"/>
      <stop offset="1" stop-color="#0d1321"/>
    </linearGradient>
    <radialGradient id="crater" cx="0.32" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#fff6dd" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#6e7891" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#24314d" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.48" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.18"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.1"/></filter>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#786a52" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="1000" fill="url(#paper)"/>
  <rect width="1000" height="1000" fill="url(#hatch)"/>
  <path d="M0 740 C180 720 300 770 470 744 S780 700 1000 742 V1000 H0Z" fill="#c4ad88" opacity="0.55"/>
  <circle cx="525" cy="468" r="295" fill="#f2e7d0"/>
  <circle cx="540" cy="455" r="278" fill="url(#moon)"/>
  <g opacity="0.9">
    <circle cx="460" cy="352" r="56" fill="url(#crater)"/>
    <circle cx="610" cy="520" r="84" fill="url(#crater)"/>
    <circle cx="442" cy="568" r="32" fill="url(#crater)"/>
    <circle cx="648" cy="302" r="22" fill="url(#crater)"/>
    <circle cx="382" cy="458" r="14" fill="url(#crater)"/>
  </g>
  <path d="M342 289 C432 208 628 220 716 350" fill="none" stroke="#fff9e9" stroke-opacity="0.25" stroke-width="1.3"/>
  <g transform="translate(758 694)">
    <circle r="64" fill="#b73f37"/>
    <circle r="64" fill="none" stroke="#f4e9d2" stroke-width="1.5" stroke-opacity="0.7"/>
    <path d="M-23 6 C-8 -24 22 -23 27 5 C32 32 4 43 -12 27" fill="none" stroke="#f7e5c8" stroke-width="2"/>
    <circle cx="5" cy="-2" r="3" fill="#f7e5c8"/>
  </g>
  <g fill="#1a2238" font-family="'Segoe UI', Arial, sans-serif">
    <text x="62" y="86" font-size="15" letter-spacing="7">KAI ITO</text>
    <text x="62" y="121" font-size="10" letter-spacing="4" opacity="0.6">A LITTLE ORBIT FOR TWO</text>
    <text x="62" y="892" font-size="100" font-weight="700" letter-spacing="-4">PAPER</text>
    <text x="62" y="972" font-size="100" font-weight="700" letter-spacing="-4">MOON</text>
    <text x="935" y="930" text-anchor="end" font-size="11" letter-spacing="4" opacity="0.55">SONORA / 2026</text>
  </g>
  <rect width="1000" height="1000" filter="url(#grain)" opacity="0.75"/>
</svg>
