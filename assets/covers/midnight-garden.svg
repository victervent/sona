      <stop offset="0.46" stop-color="#071b20"/>
      <stop offset="1" stop-color="#03070b"/>
    </radialGradient>
    <linearGradient id="vine" x1="0" y1="1" x2="0.7" y2="0">
      <stop offset="0" stop-color="#17695e"/>
      <stop offset="0.55" stop-color="#4ac7a8"/>
      <stop offset="1" stop-color="#d7ffbd"/>
